<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live in Paris</title>
<meta name="description" content="Le programme des concerts autour de Paris, par genre, salle et nouveautés.">
<meta property="og:site_name" content="Live in Paris">
<meta property="og:title" content="Live in Paris — concerts à Paris cette semaine">
<meta property="og:description" content="Le programme des concerts autour de Paris, par genre, salle et nouveautés.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Archivo:wdth,wght@75..100,400;75..100,500;75..100,600;75..100,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<header class="top">
  <div class="mast">
    <h1>Live in Paris</h1>
    <small id="meta"></small>
  </div>
  <div class="hrow" id="hrow">
    <div class="sbar" id="sbar">
      <div class="srow" id="srow">
        <button type="button" class="back" id="sback" aria-label="Fermer la recherche">‹</button>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <div class="field" id="field">
          <span id="chips"></span>
          <input id="search" type="text" placeholder="Artiste, salle, genre…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
                 aria-label="Rechercher un artiste, une salle, un genre ou un style" role="combobox" aria-expanded="false" aria-controls="ta" aria-autocomplete="list" aria-haspopup="listbox">
        </div>
        <button type="button" id="sclear" class="x" aria-label="Effacer le texte" hidden>✕</button>
        <kbd class="kbd" id="skbd" aria-hidden="true">⌘K</kbd>
      </div>
      <div class="ta" id="ta" role="listbox" aria-label="Suggestions" hidden></div>
    </div>
    <div class="pills" id="pills">
      <button type="button" class="pill" id="gbtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="gpanel">Genres <small></small><span class="car" aria-hidden="true">▾</span></button>
      <button type="button" class="pill" id="newonly" aria-pressed="false" title="Concerts annoncés ces derniers jours">Nouveautés <small></small></button>
      <button type="button" class="pill" id="mine" aria-pressed="false" title="Les concerts marqués Intéressé ou J'y vais">Mes concerts <small></small></button>
      <button type="button" class="pill" id="near" aria-pressed="false" title="Salles à distance de marche"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg><span>Près de moi</span></button>
      <select id="radius" class="pill" hidden aria-label="Rayon">
        <option value="2">2 km</option><option value="5" selected>5 km</option>
        <option value="10">10 km</option><option value="25">25 km</option><option value="1000">Tout</option>
      </select>
    </div>
    <div class="gpanel" id="gpanel" role="dialog" aria-label="Genres et styles" hidden>
      <h4>Genres <button type="button" class="link" id="gclear" hidden>Tout effacer</button></h4>
      <div class="gs" id="glist"></div>
      <div class="sty" id="gsty" hidden>
        <h4><span id="gstitle">Styles</span><input id="gsq" type="text" placeholder="Filtrer les styles…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Filtrer les styles"></h4>
        <div class="gs" id="slist"></div>
      </div>
    </div>
  </div>
</header>

<nav class="weeknav">
  <div class="arrows" id="arrows">
    <button id="prev" aria-label="Semaine précédente">‹</button><button id="next" aria-label="Semaine suivante">›</button>
  </div>
  <strong id="weeklabel"></strong>
  <em id="weekcount"></em>
  <button id="thisweek" class="link" hidden>Cette semaine</button>
</nav>

<main id="list" class="list"></main>

<div id="detail" class="detail" hidden>
  <div class="sheet">
    <button class="close" id="close" aria-label="Fermer">✕</button>
    <div class="hero" id="hero"><div class="hero-text" id="hero-text"></div></div>
    <div class="body" id="detail-body"></div>
  </div>
</div>

<script src="app.js?v=9"></script>
</body>
</html>
