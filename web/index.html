<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live in Paris</title>
<meta name="description" content="The concert programme in and around Paris, by genre, venue and new announcements.">
<meta property="og:site_name" content="Live in Paris">
<meta property="og:title" content="Live in Paris — concerts in Paris this week">
<meta property="og:description" content="The concert programme in and around Paris, by genre, venue and new announcements.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Archivo:wdth,wght@75..100,400;75..100,500;75..100,600;75..100,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=12">
</head>
<body>
<header class="top">
  <div class="mast">
    <h1>Live in Paris</h1>
    <small id="meta"></small>
  </div>
  <div class="hrow" id="hrow">
    <div class="sbar" id="sbar">
      <div class="srow" id="srow">
        <button type="button" class="back" id="sback" aria-label="Close the search">‹</button>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <div class="field" id="field">
          <span id="chips"></span>
          <input id="search" type="text" placeholder="Artist, venue, genre…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
                 aria-label="Search for an artist, a venue, a genre or a style" role="combobox" aria-expanded="false" aria-controls="ta" aria-autocomplete="list" aria-haspopup="listbox">
        </div>
        <button type="button" id="sclear" class="x" aria-label="Clear the text" hidden>✕</button>
        <kbd class="kbd" id="skbd" aria-hidden="true">⌘K</kbd>
      </div>
      <div class="ta" id="ta" role="listbox" aria-label="Suggestions" hidden></div>
    </div>
    <div class="pills" id="pills">
      <button type="button" class="pill" id="gbtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="gpanel">Genres <small></small><span class="car" aria-hidden="true">▾</span></button>
      <button type="button" class="pill" id="newonly" aria-pressed="false" title="Concerts announced in the last few days">New <small></small></button>
      <button type="button" class="pill" id="mine" aria-pressed="false" title="Concerts marked Interested or Going">My concerts <small></small></button>
      <button type="button" class="pill" id="myvenues" aria-pressed="false" title="Concerts at my favourite venues (★ on a concert or on a venue chip)">My venues <small></small></button>
      <button type="button" class="pill" id="myartists" aria-pressed="false" title="Concerts by the artists of my liked songs on Spotify"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M6.8 9.4c3.7-1.1 7.6-.7 10.7 1.2M7.4 12.6c3-.9 6.1-.5 8.6 1M8 15.6c2.3-.7 4.6-.4 6.5.8"/></svg><span>My artists</span><small></small></button>
      <button type="button" class="spme" id="spme" hidden aria-haspopup="menu" aria-expanded="false" aria-controls="spmenu" aria-label="My Spotify account" title="My Spotify account"></button>
      <button type="button" class="pill" id="near" aria-pressed="false" title="Venues within walking distance"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg><span>Near me</span></button>
      <select id="radius" class="pill" hidden aria-label="Radius">
        <option value="2">2 km</option><option value="5" selected>5 km</option>
        <option value="10">10 km</option><option value="25">25 km</option><option value="1000">Any</option>
      </select>
    </div>
    <div class="gpanel" id="gpanel" role="dialog" aria-label="Genres and styles" hidden>
      <h4>Genres <button type="button" class="link" id="gclear" hidden>Clear all</button></h4>
      <div class="gs" id="glist"></div>
      <div class="sty" id="gsty" hidden>
        <h4><span id="gstitle">Styles</span><input id="gsq" type="text" placeholder="Filter styles…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Filter styles"></h4>
        <div class="gs" id="slist"></div>
      </div>
    </div>
    <div class="spmenu" id="spmenu" role="menu" aria-label="My Spotify account" hidden></div>
  </div>
</header>

<nav class="weeknav">
  <strong id="weeklabel"></strong>
  <em id="weekcount"></em>
  <div class="months" id="months" role="navigation" aria-label="Months"></div>
</nav>

<main id="list" class="list"></main>

<div id="detail" class="detail" hidden>
  <div class="sheet">
    <button class="close" id="close" aria-label="Close">✕</button>
    <div class="hero" id="hero"><div class="hero-text" id="hero-text"></div></div>
    <div class="body" id="detail-body"></div>
  </div>
</div>

<div id="spdialog" class="spveil" hidden>
  <div class="spbox" role="dialog" aria-modal="true" aria-labelledby="sptitle">
    <button type="button" class="x" id="spclose" aria-label="Close">✕</button>
    <h4 id="sptitle"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M6.8 9.4c3.7-1.1 7.6-.7 10.7 1.2M7.4 12.6c3-.9 6.1-.5 8.6 1M8 15.6c2.3-.7 4.6-.4 6.5.8"/></svg>Connect Spotify</h4>
    <div id="spbody"></div>
  </div>
</div>

<script src="config.js?v=12"></script>
<script src="app.js?v=12"></script>
</body>
</html>
