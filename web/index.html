<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live in Paris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=Archivo:wdth,wght@75..100,400;75..100,500;75..100,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<header class="top">
  <h1>Live in Paris<small id="meta"></small></h1>
  <div class="tools">
    <input id="search" type="search" placeholder="Artiste, salle…" autocomplete="off" aria-label="Rechercher">
    <button id="near" class="btn" title="Trier par distance à pied">Près de moi</button>
    <select id="radius" class="btn" hidden aria-label="Rayon">
      <option value="2">2 km</option><option value="5" selected>5 km</option>
      <option value="10">10 km</option><option value="25">25 km</option><option value="1000">Tout</option>
    </select>
  </div>
</header>

<nav class="weeknav">
  <div class="arrows" id="arrows">
    <button id="prev" aria-label="Semaine précédente">‹</button><button id="next" aria-label="Semaine suivante">›</button>
  </div>
  <strong id="weeklabel"></strong>
  <button id="thisweek" class="link" hidden>‹ Cette semaine</button>
  <div class="views" id="tabs" role="tablist">
    <button data-tab="week">Semaine <b></b></button>
    <button data-tab="month">30 jours <b></b></button>
    <button data-tab="new">Nouveautés <b></b></button>
    <button data-tab="all">Tout <b></b></button>
  </div>
</nav>

<section class="filters">
  <div class="chips" id="genres"></div>
  <div class="chips styles" id="styles" hidden></div>
  <div class="row">
    <button class="chip flag" id="free" data-flag="free">Gratuit</button>
    <button class="chip flag" id="saved" data-flag="saved">Mes concerts <small></small></button>
    <div class="venuepick" id="venuepick">
      <button type="button" class="chip" id="venue" aria-haspopup="listbox" aria-expanded="false" aria-controls="venuepop">Toutes les salles</button>
      <div class="venuepop" id="venuepop" hidden>
        <div class="head">
          <input id="venue-q" type="search" placeholder="Chercher une salle…" autocomplete="off" aria-label="Chercher une salle"
                 role="combobox" aria-expanded="true" aria-controls="venuelist" aria-autocomplete="list">
          <button type="button" id="venue-clear" class="link" hidden>Tout effacer</button>
        </div>
        <div class="venuelist" id="venuelist" role="listbox" aria-multiselectable="true" aria-label="Salles"></div>
      </div>
    </div>
    <div class="chips venuesel" id="venuesel"></div>
    <label class="toggle"><input type="checkbox" id="others"> Inclure les non-concerts</label>
    <button id="reset" class="link">Réinitialiser</button>
  </div>
</section>

<main id="list" class="list"></main>

<div id="detail" class="detail" hidden>
  <div class="sheet">
    <button class="close" id="close" aria-label="Fermer">✕</button>
    <div class="hero" id="hero"><div class="hero-text" id="hero-text"></div></div>
    <div class="body" id="detail-body"></div>
  </div>
</div>

<script src="app.js?v=7"></script>
</body>
</html>
